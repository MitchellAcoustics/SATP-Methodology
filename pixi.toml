[workspace]
channels = ["conda-forge"]
name = "SATP-Methodology"
platforms = ["linux-aarch64", "linux-64"]
version = "0.1.0"

[tasks]
install-circe = "Rscript -e 'remotes::install_github(\"MitchellAcoustics/CircE-R\", force = TRUE)'"


[dependencies]
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.2.0,<8"
ipywidgets = ">=8.1.8,<9"
jupyter-cache = ">=1.0.1,<2"
num2words = ">=0.5.14,<0.6"
papermill = ">=2.7.0,<3"
rich = ">=14.3.3,<15"
scikit-learn = ">=1.8.0,<2"
r-base = ">=4.3.3,<4.4"
r-sn = ">=2.1.1,<3"
rpy2 = "3.5.*"
r-remotes = ">=2.5.0,<3"
r-rmarkdown = ">=2.29,<3"
r-knitr = ">=1.50,<2"
r-yaml = ">=2.3.10,<3"

[environments]

[pypi-dependencies]
rthor = ">=0.2.1, <0.3"
qc-procrustes = ">=1.1.2, <2"
circumplex = ">=0.3.0rc1"
soundscapy = { version = ">=0.8.0rc5", extras = ["all"] }
quarto-cli = ">=1.8.27, <2"
